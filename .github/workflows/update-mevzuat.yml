name: DETSIS mevzuat verisini güncelle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/update-mevzuat.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: detsis-mevzuat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: DETSİS scraper çalıştır
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::DETSİS scraper adımı başarısız oldu."; echo "---- logs/hata_log.csv ----"; test -f logs/hata_log.csv && tail -n 80 logs/hata_log.csv || echo "hata_log.csv yok"; echo "---- logs/new_records.log ----"; test -f logs/new_records.log && tail -n 80 logs/new_records.log || echo "new_records.log yok"; echo "---- logs/son_degisim_raporu.json ----"; test -f logs/son_degisim_raporu.json && cat logs/son_degisim_raporu.json || echo "son_degisim_raporu.json yok"; echo "---- data klasörü ----"; ls -la data || true' ERR
          echo "Python sürümü:"
          python --version
          echo "Çalışma dizini: $PWD"
          echo "Kaynak URL scraper.py içinde tanımlıdır."
          echo "PDF/son değişiklik tarihi bağımlılık kontrolü:"
          python - <<'PY'
          import importlib.util
          print(f"- pypdf: {'var' if importlib.util.find_spec('pypdf') else 'YOK'}")
          print("- Son değişiklik tarihi bulunamazsa workflow başarısız sayılmaz; kayıt '-' / 'Bulunamadı' olarak yazılır.")
          PY
          echo "DETSİS scraper başlatılıyor..."
          python scraper.py
          echo "Scraper tamamlandı. Üretilen veri özeti:"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/mevzuatlar.json")
          if not path.exists():
              raise SystemExit("HATA: data/mevzuatlar.json oluşmadı.")

          data = json.loads(path.read_text(encoding="utf-8"))
          total = data.get("toplam")
          records = data.get("kayitlar") or []
          if not records:
              raise SystemExit("HATA: JSON oluştu ama kayıt listesi boş.")
          print(f"Toplam kayıt: {data.get('toplam')}")
          if total != len(records):
              raise SystemExit(f"HATA: toplam alanı ({total}) kayıt listesiyle ({len(records)}) eşleşmiyor.")
          print("Kategori sayıları:")
          for category, count in data.get("kategori_sayilari", {}).items():
              print(f"- {category}: {count}")
          report = data.get("son_degisim_raporu") or {}
          print("Son değişiklik tarihi raporu:")
          print(f"- Bulunan: {report.get('bulunan', 0)}")
          print(f"- Bulunamayan: {report.get('bulunamayan', 0)}")
          print(f"- HTML: {report.get('html', 0)}")
          print(f"- PDF: {report.get('pdf', 0)}")
          print(f"- Bulunamadı: {report.get('bulunamadi', report.get('bulunamayan', 0))}")
          print(f"- PDF indirilemeyen/okunamayan: {report.get('pdf_indirilemeyen', 0)}")
          print(f"- Son değişiklik hata sayısı: {report.get('hata_sayisi', 0)}")
          PY

      - name: DETSİS loglarını göster
        if: always()
        run: |
          echo "---- logs/hata_log.csv (son 80 satır) ----"
          test -f logs/hata_log.csv && tail -n 80 logs/hata_log.csv || echo "hata_log.csv yok"
          echo "---- logs/new_records.log (son 80 satır) ----"
          test -f logs/new_records.log && tail -n 80 logs/new_records.log || echo "new_records.log yok"
          echo "---- logs/son_degisim_raporu.json ----"
          test -f logs/son_degisim_raporu.json && cat logs/son_degisim_raporu.json || echo "son_degisim_raporu.json yok"

      - name: Veri değiştiyse commit ve push yap
        run: |
          set -Eeuo pipefail
          echo "Commit öncesi uzak main ile senkronize ediliyor."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

          git add -- data/mevzuatlar.json data/mevzuatlar.csv
          test -f logs/hata_log.csv && git add -- logs/hata_log.csv || true
          test -f logs/new_records.log && git add -- logs/new_records.log || true
          test -f logs/son_degisim_raporu.json && git add -- logs/son_degisim_raporu.json || true
          if compgen -G "data/archive/*.json" > /dev/null; then
            git add -- data/archive/*.json
          fi
          if git diff --cached --quiet; then
            echo "Veri değişikliği yok, commit atılmayacak."
            exit 0
          fi

          git commit -m "data: DETSIS mevzuat verisini güncelle"
          echo "Commit sonrası push deneniyor."
          git push origin HEAD:main

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Statik siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: GitHub Pages yayınla
        id: deployment
        uses: actions/deploy-pages@v4
