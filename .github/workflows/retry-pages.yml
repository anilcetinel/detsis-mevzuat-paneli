name: GitHub Pages deploy recovery

on:
  workflow_run:
    workflows:
      - "GitHub Pages deploy"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to release the deployment
        run: |
          echo "Deployment failed. Waiting 5 minutes before a clean retry."
          sleep 300

      - name: Start a clean Pages workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Starting a new run so it contains exactly one github-pages artifact."
          gh workflow run deploy-pages.yml --repo "${REPOSITORY}" --ref main
