name: GitHub Pages yayını

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "assets/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Statik siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: GitHub Pages yayınla
        id: deployment
        uses: actions/deploy-pages@v4
